name: Build and Release EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      release_notes:
        description: "What's new in this release?"
        required: false
        default: "Bug fixes and improvements."

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install customtkinter pyinstaller

      - name: Build EXE with PyInstaller
        run: pyinstaller JSON-Prettifier.spec

      - name: Create GitHub Release and upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "JSON Prettifier v${{ github.event.inputs.version }}"
          body: |
            ## JSON Prettifier v${{ github.event.inputs.version }}

            ${{ github.event.inputs.release_notes }}

            ---

            ### Download
            Download **JSON-Prettifier.exe** below — no installation needed, just run it.

            ### What it does
            A lightweight Windows desktop app to batch-format ugly JSON files into clean,
            human-readable output. Select one or multiple `.json` files, choose an output
            folder, and hit **Prettify JSON**.

            **Built by Harshmeet Singh**
          draft: false
          prerelease: false
          files: dist/JSON-Prettifier.exe
