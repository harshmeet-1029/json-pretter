name: Build and Release EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      release_notes:
        description: "What's new in this release?"
        required: false
        default: "Bug fixes and improvements."

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install customtkinter pyinstaller

      - name: Build EXE with PyInstaller
        run: pyinstaller JSON-Prettifier.spec

      - name: Create GitHub Release and upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "JSON Prettifier v${{ github.event.inputs.version }}"
          body: |
            ## JSON Prettifier v${{ github.event.inputs.version }}

            ${{ github.event.inputs.release_notes }}

            ---

            ## What is JSON Prettifier?

            JSON Prettifier is a lightweight Windows desktop app that formats messy, minified, or hard-to-read JSON files into clean, properly indented output — instantly and with no setup required.

            Whether you are debugging API responses, reviewing config files, or just trying to make sense of a wall of JSON, this tool makes it readable in seconds.

            ---

            ## Features

            - **Batch processing** — select and prettify multiple `.json` files at once
            - **Custom output folder** — save formatted files wherever you want, or defaults to the same folder as your input
            - **Non-destructive by default** — original files are never touched unless you explicitly enable the delete option
            - **Progress tracking** — live progress bar shows exactly which file is being processed and how long it takes
            - **No installation needed** — single portable `.exe`, just download and run

            ---

            ## How to Use

            1. Download **JSON-Prettifier.exe** from the Assets section below
            2. Double-click to run it — no installer, no Python required
            3. Click **Browse Files** and select one or more `.json` files
            4. Optionally click **Choose Folder** to set a custom output location (defaults to the input file's folder)
            5. Click **✨ Prettify JSON**
            6. Your formatted files will be saved with `_pretty` added to the filename (e.g. `data.json` → `data_pretty.json`)

            > **Optional:** Check the "Delete original files" box if you want the originals removed after processing. You will be asked to confirm before anything is deleted.

            ---

            **Built by Harshmeet Singh**
          draft: false
          prerelease: false
          files: dist/JSON-Prettifier.exe
